<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>개인 비서 AI</title>
<style>
html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;position:relative;z-index:10;pointer-events:auto;-webkit-appearance:none}
textarea{position:relative;z-index:5;pointer-events:auto}

*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding:24px 18px 36px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1{font-size:22px;margin:0}.sub{color:#777;font-size:13px;margin-top:5px}
button{border:0;border-radius:12px;padding:10px 13px;background:#171717;color:white;font-weight:600}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{background:white;color:#555;border:1px solid #ddd}.tabs button.active{background:#171717;color:white}
.chat{min-height:240px}.msg{padding:14px 16px;border-radius:17px;margin:9px 0;line-height:1.5;white-space:pre-line}.user{background:#171717;color:white;margin-left:12%}.bot{background:white;border:1px solid #e7e7e7;margin-right:8%}
.composer{position:sticky;bottom:0;background:#f7f7f8;padding:12px 0;display:flex;gap:8px}
textarea{flex:1;resize:none;border:1px solid #ddd;border-radius:16px;padding:13px;font:inherit;min-height:50px;max-height:120px;background:white}
.calendar{background:white;border:1px solid #e5e5e5;border-radius:18px;padding:14px;margin-top:15px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{padding:7px 2px;border-radius:10px;min-height:44px;font-size:13px}.day.has{font-weight:700;background:#f0f0f2}.day.sel{outline:2px solid #171717}.dot{font-size:9px;margin-top:3px}.events{margin-top:14px;border-top:1px solid #eee;padding-top:10px}.event{padding:9px 0;border-bottom:1px solid #eee}.event:last-child{border:0}.time{font-size:12px;color:#777}.suggest{margin-top:10px;padding:12px;background:#f2f2f3;border-radius:12px}.small{font-size:12px;color:#777}
</style>
</head>
<body>
<div class="app">
<header><div><h1>개인 비서</h1><div class="sub">일정 · 충돌 · 음성 · AI</div></div><button type="button" id="clearBtn">초기화</button></header>
<div class="tabs">
<button type="button" id="chatTab" class="active">비서</button>
<button type="button" id="monthTab">월간 일정</button>
</div>
<section id="chatMode">
<div id="chat" class="chat">
<div class="msg bot">무엇을 도와드릴까요?
예: “내일 오후 3시에 교수님 미팅 추가해”
예: “9월 3일에 무슨 일정 있어?”
예: “내일 일정 너무 빡빡한데 충돌 확인해줘”</div>
</div>
<div class="composer">
<textarea id="input" placeholder="한국어로 명령하세요"></textarea>
<button type="button" id="voiceBtn">🎙</button><button type="button" id="sendBtn">전송</button>
</div>
</section>
<section id="monthMode" style="display:none"><div id="calendar"></div></section>
</div>
<script>
const KEY='personal-secretary-demo-v1';
let events=JSON.parse(localStorage.getItem(KEY)||'[]');
let calDate=new Date(); let selected=new Date();
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=d=>`${d.getMonth()+1}월 ${d.getDate()}일`;
const save=()=>localStorage.setItem(KEY,JSON.stringify(events));
function addMsg(text,who='bot'){let e=document.createElement('div');e.className='msg '+who;e.textContent=text;document.getElementById('chat').appendChild(e);window.scrollTo(0,document.body.scrollHeight)}
function parseDate(s){
 let now=new Date(), d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 if(/모레/.test(s)) d.setDate(d.getDate()+2); else if(/내일/.test(s)) d.setDate(d.getDate()+1); else if(/오늘/.test(s)){}
 else {let m=s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/); if(m)d=new Date(now.getFullYear(),+m[1]-1,+m[2]); else {m=s.match(/(\d{1,2})\s*일/);if(m)d=new Date(now.getFullYear(),now.getMonth(),+m[1]);}}
 return d;
}
function parseTime(s){let m=s.match(/(오전|오후)?\s*(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/);if(!m)return [9,0];let h=+m[2],mi=+(m[3]||0);if(m[1]=='오후'&&h<12)h+=12;if(m[1]=='오전'&&h==12)h=0;return[h,mi]}
function titleOf(s){return s.replace(/오늘|내일|모레|\d{1,2}\s*월\s*\d{1,2}\s*일|\d{1,2}\s*일/g,'').replace(/(오전|오후)?\s*\d{1,2}\s*시(?:\s*\d{1,2}\s*분)?/g,'').replace(/일정|추가해|추가|등록해|등록|잡아|줘|해|에/g,' ').replace(/\s+/g,' ').trim()||'새 일정'}
function sameDay(a,b){return dateKey(new Date(a))===dateKey(b)}
function dayEvents(d){return events.filter(e=>sameDay(e.start,d)).sort((a,b)=>new Date(a.start)-new Date(b.start))}
function run(){
 let s=document.getElementById('input').value.trim();if(!s)return;document.getElementById('input').value='';addMsg(s,'user');
 let isAdd=/추가|등록|잡아/.test(s), isQuery=/무슨 일정|뭐가 있어|일정.*있|확인|보여/.test(s);
 if(isAdd){
   let d=parseDate(s), [h,mi]=parseTime(s), start=new Date(d);start.setHours(h,mi,0,0);let end=new Date(start);end.setMinutes(end.getMinutes()+60);
   let title=titleOf(s), conflicts=events.filter(e=>new Date(e.start)<end&&new Date(e.end)>start);
   if(conflicts.length){
     let names=conflicts.map(e=>`${fmt(new Date(e.start))} ${new Date(e.start).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})} ${e.title}`).join('\n');
     let sug=new Date(start);sug.setHours(h+1,mi,0,0);
     while(events.some(e=>new Date(e.start)<new Date(sug.getTime()+3600000)&&new Date(e.end)>sug))sug.setMinutes(sug.getMinutes()+30);
     addMsg(`⚠️ 기존 일정과 충돌합니다.\n${names}\n\n대안: ${fmt(sug)} ${sug.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})}에 옮기는 것을 추천합니다.`);
     renderCalendar(d);return;
   }
   events.push({id:Date.now(),title,start:start.toISOString(),end:end.toISOString()});save();
   addMsg(`일정을 추가했습니다.\n${fmt(start)} ${start.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})} · ${title}`);
   renderCalendar(start);return;
 }
 if(isQuery){
   let d=parseDate(s), es=dayEvents(d);addMsg(es.length?`${fmt(d)} 일정입니다.\n`+es.map(e=>`${new Date(e.start).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})} · ${e.title}`).join('\n'):`${fmt(d)}에는 일정이 없습니다.`);renderCalendar(d);return;
 }
 // AI-style general assistant fallback
 let es=events.sort((a,b)=>new Date(a.start)-new Date(b.start)).slice(0,12);
 let summary=es.length?'저장된 일정 기준으로 답변할 수 있습니다.\n\n'+es.map(e=>`${fmt(new Date(e.start))} ${new Date(e.start).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})} · ${e.title}`).join('\\n'):'현재 저장된 일정이 없습니다.';
 addMsg(`요청을 이해했습니다.\n${summary}\n\n※ 이 데모의 AI는 일정 명령/조회/충돌 처리를 우선 지원합니다.`);
}
function renderCalendar(sel=selected){
 selected=sel;let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0), html=`<div class="calendar"><div class="calhead"><button type="button" id="prevMonth">‹</button><b>${y}년 ${m+1}월</b><button type="button" id="nextMonth">›</button></div><div class="grid">${['일','월','화','수','목','금','토'].map(x=>`<div class="small">${x}</div>`).join('')}`;
 for(let i=0;i<first.getDay();i++)html+='<div></div>';
 for(let n=1;n<=last.getDate();n++){let d=new Date(y,m,n),has=dayEvents(d).length;html+=`<div class="day ${has?'has':''} ${sameDay(d,sel)?'sel':''}" data-day="${n}">${n}${has?'<div class="dot">●</div>':''}</div>`}
 html+='</div><div class="events">';
 let es=dayEvents(sel);html+=`<b>${fmt(sel)}</b>`;html+=es.length?es.map(e=>`<div class="event"><div class="time">${new Date(e.start).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})} – ${new Date(e.end).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})}</div>${e.title}</div>`).join(''):'<div class="small" style="margin-top:8px">일정 없음</div>';
 html+='</div></div>';document.getElementById('calendar').innerHTML=html
}
function moveMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar(selected)}
function showMode(mode){document.getElementById('chatMode').style.display=mode==='chat'?'block':'none';document.getElementById('monthMode').style.display=mode==='month'?'block':'none';document.getElementById('chatTab').classList.toggle('active',mode==='chat');document.getElementById('monthTab').classList.toggle('active',mode==='month');if(mode==='month')renderCalendar(selected)}
function clearAll(){if(confirm('모든 데모 일정을 삭제할까요?')){events=[];save();renderCalendar(selected);addMsg('저장된 일정을 모두 삭제했습니다.')}}
function voice(){
 if(!('webkitSpeechRecognition' in window)){alert('이 브라우저에서는 음성 인식을 지원하지 않습니다. iPhone Safari에서 사용해보세요.');return}
 let r=new webkitSpeechRecognition();r.lang='ko-KR';r.interimResults=false;r.onresult=e=>{document.getElementById('input').value=e.results[0][0].transcript;run()};r.start()
}

document.getElementById('clearBtn').addEventListener('click', clearAll);
document.getElementById('chatTab').addEventListener('click', ()=>showMode('chat'));
document.getElementById('monthTab').addEventListener('click', ()=>showMode('month'));
document.getElementById('sendBtn').addEventListener('click', run);
document.getElementById('voiceBtn').addEventListener('click', voice);

document.getElementById('calendar').addEventListener('click', (e)=>{
  const dayEl=e.target.closest('[data-day]');
  if(dayEl){
    const n=Number(dayEl.dataset.day);
    renderCalendar(new Date(calDate.getFullYear(),calDate.getMonth(),n));
    return;
  }
  if(e.target.closest('#prevMonth')) { moveMonth(-1); return; }
  if(e.target.closest('#nextMonth')) { moveMonth(1); return; }
});

document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run()}})
renderCalendar(new Date());
</script>
</body></html>
